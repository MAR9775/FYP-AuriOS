<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' app://app; script-src 'self' app://app 'unsafe-inline'; style-src 'self' app://app 'unsafe-inline'; connect-src 'self' app://app http://127.0.0.1:8000;" />
  <title>AuriOS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Radial ambient glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 50% 45%, rgba(99,102,241,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 30% 70%, rgba(139,92,246,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .splash-container {
      position: relative;
      z-index: 10;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    /* ── Logo ───────────────────────────────────────────────────────────── */
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: appear 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-mark {
      width: 64px; height: 64px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hexagon-ish shape for the mark */
    .logo-mark svg {
      width: 64px; height: 64px;
      filter: drop-shadow(0 0 18px rgba(99,102,241,0.55));
    }

    .logo-name {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #f0f0f8;
      line-height: 1;
    }

    .logo-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #4b5563;
      animation: appear 0.5s ease 0.7s both;
    }

    /* ── Waveform bars ──────────────────────────────────────────────────── */
    .wave-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 48px;
      animation: appear 0.5s ease 0.5s both;
    }

    .bar {
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(to top, #6366f1, #a78bfa);
      animation: wave var(--d, 1.1s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
      transform-origin: bottom;
    }

    @keyframes wave {
      0%   { height: 6px;  opacity: 0.4; }
      100% { height: var(--peak, 32px); opacity: 1; }
    }

    /* ── Status line ────────────────────────────────────────────────────── */
    .status-line {
      font-size: 12px;
      color: #374151;
      letter-spacing: 0.08em;
      height: 18px;
      animation: appear 0.4s ease 1s both;
      transition: color 0.4s ease;
    }
    .status-line.ready { color: #4ade80; }

    /* ── Progress bar ───────────────────────────────────────────────────── */
    .progress-wrap {
      width: 280px;
      animation: appear 0.4s ease 1.1s both;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(99, 102, 241, 0.10);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1 0%, #a78bfa 60%, #c084fc 100%);
      border-radius: 2px;
      transition: width 0.1s ease;
      box-shadow: 0 0 6px rgba(99,102,241,0.5);
    }

    /* ── Fade-out ───────────────────────────────────────────────────────── */
    body.fade-out {
      transition: opacity 0.4s ease;
      opacity: 0 !important;
    }
  </style>
</head>
<body>

  <div class="splash-container">

    <div class="logo-block">
      <div class="logo-mark">
        <!-- Clean geometric mark: overlapping circles forming an "A" wave motif -->
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
          <path d="M14 38 Q22 16 32 32 Q42 48 50 26" stroke="#6366f1" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="32" cy="32" r="4" fill="#6366f1" opacity="0.85"/>
          <circle cx="14" cy="38" r="2.5" fill="#818cf8" opacity="0.7"/>
          <circle cx="50" cy="26" r="2.5" fill="#818cf8" opacity="0.7"/>
        </svg>
      </div>
      <div class="logo-name">AuriOS</div>
      <div class="logo-sub">Voice Intelligence Platform</div>
    </div>

    <!-- Waveform: 17 bars with staggered timing and peaks -->
    <div class="wave-wrap" id="wave-wrap"></div>

    <div class="status-line" id="status-line">Starting up…</div>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

  </div>

  <script>
    /* ── Generate waveform bars ─────────────────────────────────────────── */
    (function () {
      const wrap = document.getElementById('wave-wrap');
      const COUNT = 17;
      // Natural-looking peak heights (centre bars tallest)
      const peaks = [8,11,16,22,28,34,38,42,44,42,38,34,28,22,16,11,8];
      const durations = [1.0,0.9,1.1,0.95,1.05,0.85,1.15,1.0,0.9,1.0,1.15,0.85,1.05,0.95,1.1,0.9,1.0];

      for (let i = 0; i < COUNT; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.setProperty('--peak', peaks[i] + 'px');
        bar.style.setProperty('--d', durations[i] + 's');
        bar.style.setProperty('--delay', (i * 0.07).toFixed(2) + 's');
        bar.style.height = '6px';
        wrap.appendChild(bar);
      }
    })();

    /* ── Progress + backend poll + transition ───────────────────────────── */
    (function () {
      const fill   = document.getElementById('progress-fill');
      const status = document.getElementById('status-line');
      let pct  = 0;
      let done = false;

      function setProgress(v) {
        pct = Math.max(pct, Math.min(v, 100));
        fill.style.width = pct + '%';
      }

      // Drift to ~65% over ~2s
      const drift = setInterval(() => {
        if (pct < 65 && !done) {
          setProgress(pct + (Math.random() * 2.2 + 0.6));
        }
      }, 55);

      // Poll backend — 350ms interval, max 6 tries (~2.1s)
      let polls = 0;
      const MAX_POLLS = 6;

      const poll = setInterval(async () => {
        polls++;
        try {
          const r = await fetch('http://127.0.0.1:8000/system-status-full', {
            signal: AbortSignal.timeout(1200),
          });
          if (r.ok && !done) {
            done = true;
            clearInterval(drift);
            clearInterval(poll);
            status.textContent = 'Ready';
            status.className   = 'status-line ready';
            sprintToEnd();
          }
        } catch (_) {
          if (polls >= MAX_POLLS && !done) {
            done = true;
            clearInterval(drift);
            clearInterval(poll);
            sprintToEnd();
          }
        }
      }, 350);

      function sprintToEnd() {
        const sprint = setInterval(() => {
          setProgress(pct + 3);
          if (pct >= 100) {
            clearInterval(sprint);
            setTimeout(transitionOut, 200);
          }
        }, 16);
      }

      function transitionOut() {
        document.body.classList.add('fade-out');
        setTimeout(() => {
          if (window.api && typeof window.api.splashComplete === 'function') {
            window.api.splashComplete();
          }
        }, 420);
      }

      // Skip on click or key after 400ms
      let skipOk = false;
      setTimeout(() => { skipOk = true; }, 400);

      function skip() {
        if (!skipOk || done) return;
        done = true;
        clearInterval(drift);
        clearInterval(poll);
        setProgress(100);
        transitionOut();
      }

      document.addEventListener('click',    skip);
      document.addEventListener('keypress', skip);
    })();
  </script>

</body>
</html>
