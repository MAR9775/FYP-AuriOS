name: Continuous Integration Pipeline (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 1. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 2. Run Pytest with In-line Path Fix (The definitive solution)
    - name: Run Pytest Unit & Integration Tests
      run: |
        # Append 'src' to Python path and then run pytest in the same command environment
        python -c "import sys; sys.path.append('src')"
        pytest testing
