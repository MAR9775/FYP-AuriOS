name: Continuous Integration Pipeline (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Black Formatter Check
      run: |
        # Checks if code is formatted correctly (does not reformat)
        black --check src/ testing/
        
    - name: Run Flake8 Linting Check
      run: |
        # Checks code quality and common errors
        flake8 src/ testing/
        
    - name: Run Pytest Unit & Integration Tests
      run: |
        # Execute tests using Pytest (uses mocks to prevent real system changes)
        pytest testing/
