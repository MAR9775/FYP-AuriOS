name: Continuous Integration Pipeline (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 1. Install Dependencies (Keep this multi-line)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    
        
    # 3. Run Flake8 Linting Check (Use command directly with Windows paths)
    #- name: Run Flake8 Linting Check
     # run: flake8 src testing
        
    # 4. Run Pytest Unit & Integration Tests (Use command directly with Windows paths)
    - name: Run Pytest Unit & Integration Tests
      run: pytest testing
