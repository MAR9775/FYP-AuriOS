name: Continuous Integration Pipeline (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 1. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 2. Add 'src' to Python Path (ULTIMATE FIX for Windows Import Errors)
    - name: Set Python Path to include src
      run: python -c "import sys; sys.path.append('src')"

    # 3. Run Pytest Unit & Integration Tests
    - name: Run Pytest Unit & Integration Tests
      run: pytest testing
